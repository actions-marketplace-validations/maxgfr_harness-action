name: E2E (live models)

# Real providers, real cost: manual only. Per harness, with a real model, the scenarios of
# e2e-scenarios.yml: a skill run, loop mode, then a resumed session that must remember it.
# Anthropic-compatible harnesses run on ANTHROPIC_API_KEY; codex needs OPENAI_API_KEY (or
# OPENROUTER_API_KEY with an openrouter/… model) and is skipped without it. The keyless run on
# every push, with OpenCode's free models, is e2e-free.yml.
on:
  workflow_dispatch:
    inputs:
      harness:
        description: 'opencode | codex | pi | openclaw (empty = all)'
        required: false
        default: ''
      model:
        description: 'provider/model (empty = the per-harness default)'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  live:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.harness != '' && format('[{{"harness":"{0}","model":"{1}"}}]', inputs.harness, inputs.model) || '[{"harness":"opencode","model":""},{"harness":"pi","model":""},{"harness":"openclaw","model":""},{"harness":"codex","model":""}]') }}
    uses: ./.github/workflows/e2e-scenarios.yml
    with:
      harness: ${{ matrix.harness }}
      model: ${{ matrix.model }}
    secrets: inherit
